<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAR — Short Opportunity Engine</title>

<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--bright:#f0f6fc;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--yellow:#d29922;--purple:#bc8cff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Cascadia Code','Fira Code',monospace;background:var(--bg);color:var(--text);line-height:1.5;font-size:13px}
.wrap{max-width:1600px;margin:0 auto;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:10px}
header h1{font-size:15px;color:var(--bright)} header h1 span{color:var(--green)}
.status{font-size:10px;color:var(--dim)} .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.dot.ok{background:var(--green)}
.stats{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:5px 10px}
.stat .label{font-size:9px;color:var(--dim);text-transform:uppercase} .stat .val{font-size:14px;font-weight:700;color:var(--bright)}
.stat .val.pos{color:var(--green)} .stat .val.neg{color:var(--red)}
.papers{font-size:9px;color:var(--dim);margin-bottom:8px}
.papers a{color:var(--blue);text-decoration:none;margin-right:10px}
.main{display:grid;grid-template-columns:280px 1fr;gap:10px;margin-bottom:10px}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.tabs{display:flex;gap:2px;margin-bottom:6px}
.tab{padding:5px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px 4px 0 0;cursor:pointer;font-size:11px;color:var(--dim);transition:all .15s}
.tab:hover{color:var(--text)} .tab.active{background:var(--surface);color:var(--bright);border-bottom-color:var(--surface)}
.tab-icon{margin-right:4px}
.lb{max-height:calc(100vh - 220px);overflow-y:auto}
.lb-header{font-size:10px;color:var(--dim);margin-bottom:4px;padding:0 4px}
.lb-row{display:flex;align-items:center;gap:5px;padding:4px 5px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;font-size:12px}
.lb-row:hover{background:rgba(88,166,255,.08)} .lb-row.active{background:rgba(88,166,255,.15);border-left:2px solid var(--blue)}
.lb-rank{color:var(--dim);font-size:10px;min-width:16px}
.lb-sym{font-weight:600;min-width:50px}
.lb-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.lb-bar-fill{height:100%;border-radius:3px}
.lb-score{min-width:26px;text-align:right;font-weight:700;font-size:11px}
.lb-meta{font-size:9px;color:var(--dim);min-width:80px;text-align:right}
.hi{color:var(--red)} .md{color:var(--yellow)} .lo{color:var(--green)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px}
.panel h2{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.search{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:3px 6px;color:var(--text);font-family:inherit;font-size:11px;width:100%;margin-bottom:4px}
#chart-container{height:300px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.factor-detail{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 8px;margin:3px 0;font-size:11px}
.factor-detail .fd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.factor-detail .fd-name{font-weight:600} .factor-detail .fd-val{font-weight:700;font-size:14px}
.factor-detail .fd-bar{height:3px;background:var(--border);border-radius:2px;margin:3px 0}
.factor-detail .fd-bar-fill{height:100%;border-radius:2px}
.factor-detail .fd-formula{color:var(--blue);font-size:10px}
.factor-detail .fd-raw{color:var(--dim);font-size:10px}
.factor-detail .fd-note{color:var(--dim);font-size:9px}
.factor-detail .fd-paper a{color:var(--blue);font-size:9px;text-decoration:none}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.bottom{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--dim);font-weight:500;padding:3px 5px;border-bottom:1px solid var(--border)}
td{padding:3px 5px;border-bottom:1px solid var(--border)}
.num{text-align:right} .pos{color:var(--green)} .neg{color:var(--red)}
.chat-box{display:flex;gap:4px;margin-top:4px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:4px 6px;color:var(--text);font-family:inherit;font-size:11px}
.chat-btn{background:var(--blue);color:#fff;border:none;border-radius:3px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px}
.chat-log{max-height:140px;overflow-y:auto;font-size:11px}
.chat-msg{margin:2px 0;padding:3px 6px;border-radius:4px;max-width:90%}
.chat-msg.user{background:rgba(88,166,255,.15);margin-left:auto;text-align:right}
.chat-msg.bot{background:var(--bg);white-space:pre-wrap}
</style>
</head>

</div>

<script>
let DATA=null,selectedSym=null,chartObj=null,currentTab='price_action';

const TAB_DESC={
  price_action:'Overextended — will revert. Momentum, reversal, carry, crowding, volatility.',
  dogshit:'Fundamental garbage — bad tokenomics, junk category, overhyped, destined for zero.',
  squeeze_recovery:'Just got squeezed — shorts blown out, pumped hard, ready to re-short.',
  synthesis:'Combined signal — assets appearing in multiple boards. Maximum conviction shorts.',
};
const TAB_SCORE_LABEL={
  price_action:'Short Score',dogshit:'Garbage Score',squeeze_recovery:'Squeeze Score'
};

function loadData(){
  try{const el=document.getElementById('bear-data');const txt=el.textContent.trim();if(txt&&txt!=='{BEAR_DATA_PLACEHOLDER}')DATA=JSON.parse(txt)}catch(e){}
  if(!DATA||!DATA.markets){document.getElementById('dot').className='dot err';return}
  document.getElementById('dot').className='dot ok';
  document.getElementById('ts').textContent='Updated: '+(DATA.timestamp||'');
  renderStats();renderLeaderboard();renderMarkets();
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById('lb-desc').textContent=TAB_DESC[tab]||'';
  document.getElementById('search').value='';
  selectedSym=null;
  renderLeaderboard();
}

function renderStats(){
  const s=DATA.stats||{};
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="label">Markets</div><div class="val">${s.total_markets||0}</div></div>
    <div class="stat"><div class="label">24h Vol</div><div class="val">$${fmtV(s.total_24h_volume||0)}</div></div>
    <div class="stat"><div class="label">Avg Fund</div><div class="val">${((s.avg_funding||0)*100).toFixed(4)}%</div></div>
    <div class="stat"><div class="label">Pos Fund</div><div class="val pos">${s.positive_funding_count||0}</div></div>
    <div class="stat"><div class="label">Neg Fund</div><div class="val neg">${s.negative_funding_count||0}</div></div>`;
}

function renderLeaderboard(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const lb=(DATA.leaderboards||{})[currentTab]||[];
  const filtered=lb.filter(s=>!q||s.symbol.toLowerCase().includes(q));
  const label=TAB_SCORE_LABEL[currentTab]||'Score';
  
  document.getElementById('shorts').innerHTML=filtered.map((s,i)=>{
    const sc=s.score||0;
    let meta='';
    if(currentTab==='price_action') meta=`rev=${(s.reversal||0).toFixed(0)} carry=${(s.carry||0).toFixed(0)}`;
    else if(currentTab==='dogshit') meta=`px=${fmtPx(s.mark_px)} fund=${(s.funding*100).toFixed(4)}%`;
    else if(currentTab==='squeeze_recovery') meta=`dd=${(s.drawdown_30d||0).toFixed(0)}% pump=+${(s.pump_from_low||0).toFixed(0)}%`;
    else if(currentTab==='synthesis'){
      const boards=s.in_boards||0;
      const icons=['&#128200;','&#128148;','&#9889;'];
      const present=[];
      if(s.price_action>0) present.push(icons[0]);
      if(s.dogshit>0) present.push(icons[1]);
      if(s.squeeze>0) present.push(icons[2]);
      meta=present.join('')+' '+boards+'/3';
    }
    
    return`<div class="lb-row${selectedSym===s.symbol?' active':''}" onclick="selectSym('${s.symbol}','${currentTab}')">
      <span class="lb-rank">#${i+1}</span>
      <span class="lb-sym">${s.symbol}</span>
      <div class="lb-bar"><div class="lb-bar-fill" style="width:${Math.min(sc,100)}%;background:${sc>=70?'var(--red)':sc>=50?'var(--yellow)':'var(--green)'}"></div></div>
      <span class="lb-score ${sc>=70?'hi':sc>=50?'md':'lo'}">${sc.toFixed(0)}</span>
      <span class="lb-meta">${meta}</span>
    </div>`;
  }).join('')||'<div style="color:var(--dim);padding:8px">No matches</div>';
}

function selectSym(sym,tab){
  selectedSym=sym;
  renderLeaderboard();
  renderFactors(sym,tab);
  renderChart(sym);
}

function renderFactors(sym,tab){
  document.getElementById('factor-sym').textContent=sym;
  const f=(DATA.factors||{})[sym]||{};
  const lb=((DATA.leaderboards||{})[tab]||[]).find(s=>s.symbol===sym)||{};
  
  let html=`<div style="font-size:10px;color:var(--dim);margin-bottom:4px">${TAB_SCORE_LABEL[tab]||'Score'}: <b style="color:var(--text);font-size:14px">${lb.score||0}</b>/100 | Sector: ${lb.sector||f.sector||'?'}</div>`;
  
  if(tab==='price_action'){
    [{fn:'reversal_8w',label:'Reversal 8w',explain:'Higher = recent winner = will revert = GOOD short'},
     {fn:'volatility_30d',label:'Volatility',explain:'Lower = more stable = easier to hold short'},
     {fn:'funding_carry',label:'Funding Carry',explain:'Higher = you get paid to hold short'},
     {fn:'oi_crowding',label:'OI/ADV Crowding',explain:'Lower = less squeeze risk'},
     {fn:'momentum_7d',label:'Momentum 7d',explain:'Higher = recent winner = tends to revert'},
    ].forEach(({fn,label,explain})=>{
      const fd=f[fn];if(!fd)return;
      const v=fd.value||0;const isInverted=fn==='volatility_30d'||fn==='oi_crowding';
      const dv=isInverted?(100-v):v;const c=dv>=70?'var(--red)':dv>=50?'var(--yellow)':'var(--green)';
      html+=`<div class="factor-detail"><div class="fd-head"><span class="fd-name">${label}</span><span class="fd-val" style="color:${c}">${dv.toFixed(0)}</span></div><div class="fd-bar"><div class="fd-bar-fill" style="width:${dv}%;background:${c}"></div></div><div class="fd-formula">${fd.formula||'?'} ${fd.validated?'&#10003;':'&#10007;'}</div><div class="fd-raw">Raw: ${fd.raw!==null&&fd.raw!==undefined?fd.raw:'N/A'}${isInverted?' (low = good)':''}</div><div class="fd-note">${explain}</div>${fd.paper_url?`<div class="fd-paper"><a href="${fd.paper_url}" target="_blank">&#128218; Paper</a></div>`:''}</div>`;
    });
  } else if(tab==='dogshit'){
    [{k:'meme_score',label:'Meme Factor',explain:'Meme/animal coin with no real utility'},
     {k:'cap_score',label:'Size (Tiny)',explain:'Low volume = microcap, nobody cares'},
     {k:'fund_score',label:'Market Hates It',explain:'Negative funding = consensus it sucks'},
     {k:'price_junk',label:'Price Junk',explain:'Sub-$0.01 = likely worthless'},
    ].forEach(({k,label,explain})=>{
      const v=lb[k]||0;const c=v>=70?'var(--red)':v>=50?'var(--yellow)':v>0?'var(--green)':'var(--dim)';
      html+=`<div class="factor-detail"><div class="fd-head"><span class="fd-name">${label}</span><span class="fd-val" style="color:${c}">${v>0?v.toFixed(0):'—'}</span></div><div class="fd-note">${explain}</div></div>`;
    });
  } else if(tab==='squeeze_recovery'){
    [{k:'drawdown_30d',label:'30d Drawdown',explain:'How far it fell before the squeeze'},
     {k:'pump_from_low',label:'Pump from Low',explain:'How hard it bounced (the squeeze itself)'},
     {k:'volume_spike',label:'Volume Spike',explain:'Volume surge during the squeeze'},
    ].forEach(({k,label,explain})=>{
      const v=lb[k]||0;const c=v>=70?'var(--red)':v>=50?'var(--yellow)':'var(--green)';
      html+=`<div class="factor-detail"><div class="fd-head"><span class="fd-name">${label}</span><span class="fd-val" style="color:${c}">${v.toFixed(0)}${k==='volume_spike'?'x':''}</span></div><div class="fd-bar"><div class="fd-bar-fill" style="width:${Math.min(v,100)}%;background:${c}"></div></div><div class="fd-note">${explain}</div></div>`;
    });
  } else if(tab==='synthesis'){
    const ev=lb.evidence||[];
    const boards=lb.in_boards||0;
    html+=`<div class="factor-detail"><div class="fd-head"><span class="fd-name">Confluence</span><span class="fd-val" style="color:${boards>=3?'var(--red)':boards>=2?'var(--yellow)':'var(--green)'}">${boards}/3 boards</span></div><div class="fd-note">How many leaderboards this asset appears in — more = higher conviction</div></div>`;
    [{k:'price_action',label:'Price Action',explain:'Overextended, will revert'},
     {k:'dogshit',label:'Dogshit',explain:'Fundamental garbage, destined for zero'},
     {k:'squeeze',label:'Squeeze Recovery',explain:'Just got squeezed, ready to re-short'},
    ].forEach(({k,label,explain})=>{
      const v=lb[k]||0;const c=v>=70?'var(--red)':v>=50?'var(--yellow)':v>0?'var(--green)':'var(--dim)';
      html+=`<div class="factor-detail"><div class="fd-head"><span class="fd-name">${label}</span><span class="fd-val" style="color:${c}">${v>0?v.toFixed(0):'—'}</span></div><div class="fd-note">${explain}</div></div>`;
    });
    if(ev.length){
      html+=`<div style="margin-top:6px;font-size:10px;color:var(--dim);font-weight:600">Evidence:</div>`;
      ev.forEach(e=>{html+=`<div style="font-size:10px;color:var(--text);padding:2px 0">• ${e}</div>`});
    }
  }
  
  document.getElementById('factors').innerHTML=html;
}

function renderChart(sym){
  const candles=(DATA.candles||{})[sym];
  if(!candles||!candles.length){
    document.getElementById('chart-container').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);font-size:12px">No candle data for '+sym+'</div>';
    return;
  }
  if(typeof LightweightCharts==='undefined'){
    document.getElementById('chart-container').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--red);font-size:12px">Chart library failed to load. Check network.</div>';
    return;
  }
  const container=document.getElementById('chart-container');
  container.innerHTML='';
  const W=container.offsetWidth||container.clientWidth||600;
  const H=container.offsetHeight||container.clientHeight||300;
  chartObj=LightweightCharts.createChart(container,{
    width:W,height:H,
    layout:{background:{type:'solid',color:'#0d1117'},textStyle:{color:'#8b949e',fontSize:10}},
    grid:{vertLines:{color:'#1c2128'},horzLines:{color:'#1c2128'}},
    crosshair:{mode:0},
    timeScale:{timeVisible:false},
    rightPriceScale:{borderColor:'#30363d'},
  });
  const cs=chartObj.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#3fb950',downColor:'#f85149',borderVisible:false,wickUpColor:'#3fb950',wickDownColor:'#f85149'});
  cs.setData(candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
  const vs=chartObj.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'vol'});
  vs.priceScale().applyOptions({scaleMargins:{top:0.8,bottom:0}});
  vs.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(63,185,80,.3)':'rgba(248,81,73,.3)'})));
  chartObj.timeScale().fitContent();
}

function renderMarkets(){
  let mkts=(DATA.markets||[]).slice().sort((a,b)=>(b.day_volume||0)-(a.day_volume||0));
  document.getElementById('mkt-body').innerHTML=mkts.slice(0,30).map(m=>{
    const c=m.funding>0?'pos':m.funding<0?'neg':'';
    return`<tr><td style="font-weight:600">${m.symbol}</td><td class="num">$${fmtPx(m.mark_px)}</td><td class="num">$${fmtV(m.day_volume)}</td><td class="num ${c}">${(m.funding*100).toFixed(4)}%</td></tr>`;
  }).join('');
}

function fmtV(v){if(!v)return'0';if(v>=1e9)return(v/1e9).toFixed(1)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(1)+'K';return v.toFixed(0)}
function fmtPx(v){if(!v)return'0';if(v>=1000)return v.toFixed(0);if(v>=1)return v.toFixed(2);if(v>=0.01)return v.toFixed(4);return v.toFixed(6)}

async function sendChat(){
  const input=document.getElementById('chat-input');const msg=input.value.trim();if(!msg)return;input.value='';
  const log=document.getElementById('chat-log');
  log.innerHTML+=`<div class="chat-msg user">${esc(msg)}</div>`;log.scrollTop=log.scrollHeight;
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const d=await r.json();log.innerHTML+=`<div class="chat-msg bot">${esc(d.response||'No response')}</div>`}
  catch(e){log.innerHTML+=`<div class="chat-msg bot" style="color:var(--red)">${e.message}</div>`}
  log.scrollTop=log.scrollHeight;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

loadData();
setInterval(()=>{try{loadData()}catch(e){}},60000);
window.addEventListener('resize',()=>{if(chartObj)chartObj.applyOptions({width:document.getElementById('chart-container').clientWidth})});
</script>
