<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAR — Short Opportunity Engine</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--bright:#f0f6fc;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--yellow:#d29922}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Cascadia Code','Fira Code',monospace;background:var(--bg);color:var(--text);line-height:1.5;font-size:13px}
.wrap{max-width:1600px;margin:0 auto;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:10px}
header h1{font-size:15px;color:var(--bright)} header h1 span{color:var(--green)}
.status{font-size:10px;color:var(--dim)} .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.dot.ok{background:var(--green)} .dot.err{background:var(--red)}
.stats{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:5px 10px}
.stat .label{font-size:9px;color:var(--dim);text-transform:uppercase} .stat .val{font-size:14px;font-weight:700;color:var(--bright)}
.stat .val.pos{color:var(--green)} .stat .val.neg{color:var(--red)}
.papers{font-size:9px;color:var(--dim);margin-bottom:8px}
.papers a{color:var(--blue);text-decoration:none;margin-right:10px}
.main{display:grid;grid-template-columns:260px 1fr;gap:10px;margin-bottom:10px}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.lb{max-height:calc(100vh - 200px);overflow-y:auto}
.lb-row{display:flex;align-items:center;gap:5px;padding:4px 5px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;font-size:12px}
.lb-row:hover{background:rgba(88,166,255,.08)} .lb-row.active{background:rgba(88,166,255,.15);border-left:2px solid var(--blue)}
.lb-rank{color:var(--dim);font-size:10px;min-width:16px}
.lb-sym{font-weight:600;min-width:50px}
.lb-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.lb-bar-fill{height:100%;border-radius:3px}
.lb-score{min-width:26px;text-align:right;font-weight:700;font-size:11px}
.hi{color:var(--red)} .md{color:var(--yellow)} .lo{color:var(--green)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px}
.panel h2{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.search{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:3px 6px;color:var(--text);font-family:inherit;font-size:11px;width:100%;margin-bottom:4px}
#chart-container{height:320px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.factor-detail{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 8px;margin:3px 0;font-size:11px}
.factor-detail .fd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.factor-detail .fd-name{font-weight:600} .factor-detail .fd-val{font-weight:700;font-size:14px}
.factor-detail .fd-bar{height:3px;background:var(--border);border-radius:2px;margin:3px 0}
.factor-detail .fd-bar-fill{height:100%;border-radius:2px}
.factor-detail .fd-formula{color:var(--blue);font-size:10px}
.factor-detail .fd-raw{color:var(--dim);font-size:10px}
.factor-detail .fd-note{color:var(--dim);font-size:9px}
.factor-detail .fd-paper a{color:var(--blue);font-size:9px;text-decoration:none}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.bottom{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--dim);font-weight:500;padding:3px 5px;border-bottom:1px solid var(--border);cursor:pointer}
td{padding:3px 5px;border-bottom:1px solid var(--border)}
.num{text-align:right} .pos{color:var(--green)} .neg{color:var(--red)}
.chat-box{display:flex;gap:4px;margin-top:4px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:4px 6px;color:var(--text);font-family:inherit;font-size:11px}
.chat-btn{background:var(--blue);color:#fff;border:none;border-radius:3px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px}
.chat-log{max-height:140px;overflow-y:auto;font-size:11px}
.chat-msg{margin:2px 0;padding:3px 6px;border-radius:4px;max-width:90%}
.chat-msg.user{background:rgba(88,166,255,.15);margin-left:auto;text-align:right}
.chat-msg.bot{background:var(--bg);white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span>BEAR</span> — Short Opportunity Engine</h1>
  <div class="status"><span class="dot ok" id="dot"></span><span id="ts">loading...</span></div>
</header>
<div class="stats" id="stats"></div>
<div class="papers">
  &#128218; <a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6703978" target="_blank">Reversal (Kiefer 2026)</a>
  &#128218; <a href="https://doi.org/10.2139/ssrn.6636258" target="_blank">Dilution (Guo 2026)</a>
  &#128218; <a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6993978" target="_blank">Funding Carry (Lau 2026)</a>
  &#128218; <a href="https://pubsonline.informs.org/doi/abs/10.1287/mnsc.2024.05875" target="_blank">Value Factor (Mgmt Sci 2026)</a>
  &#9989; <span id="valid-count">0</span>/<span id="total-count">0</span> validated
</div>

<div class="main">
  <div class="panel lb">
    <h2>Best Short Targets <span id="short-count" style="float:right"></span></h2>
    <input class="search" id="search" placeholder="filter..." oninput="renderShorts()">
    <div id="shorts"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div id="chart-container"></div>
    <div class="panel">
      <h2>Score Breakdown — <span id="factor-sym" style="color:var(--blue)">click a short</span></h2>
      <div id="factors" style="max-height:300px;overflow-y:auto"></div>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="panel">
    <h2>Market Overview</h2>
    <div style="max-height:250px;overflow-y:auto">
      <table><thead><tr><th>Symbol</th><th class="num">Price</th><th class="num">Volume</th><th class="num">Funding</th></tr></thead>
      <tbody id="mkt-body"></tbody></table>
    </div>
  </div>
  <div class="panel">
    <h2>BEAR Chat</h2>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-box">
      <input class="chat-input" id="chat-input" placeholder="ask about shorts, factors, markets..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="chat-btn" onclick="sendChat()">Ask</button>
    </div>
  </div>
</div>
</div>

<script id="bear-data" type="application/json">
{BEAR_DATA_PLACEHOLDER}
</script>
<script>
let DATA=null,selectedSym=null,chartObj=null,mainSeries=null;

function loadData(){
  try{const el=document.getElementById('bear-data');const txt=el.textContent.trim();if(txt&&txt!=='{BEAR_DATA_PLACEHOLDER}')DATA=JSON.parse(txt)}catch(e){}
  if(!DATA||!DATA.markets){document.getElementById('dot').className='dot err';document.getElementById('ts').textContent='No data';return}
  document.getElementById('dot').className='dot ok';
  document.getElementById('ts').textContent='Updated: '+(DATA.timestamp||'');
  renderStats();renderShorts();renderMarkets();
  if(!selectedSym&&DATA.short_rankings.length)selectSym(DATA.short_rankings[0].symbol);
}

function renderStats(){
  const s=DATA.stats||{};
  let valid=0,total=0;
  Object.values(DATA.factors||{}).forEach(f=>{
    ['reversal_8w','volatility_30d','funding_carry','oi_crowding','momentum_7d'].forEach(fn=>{
      if(f[fn]){total++;if(f[fn].validated)valid++}
    });
  });
  document.getElementById('valid-count').textContent=valid;
  document.getElementById('total-count').textContent=total;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="label">Markets</div><div class="val">${s.total_markets||0}</div></div>
    <div class="stat"><div class="label">24h Vol</div><div class="val">$${fmtV(s.total_24h_volume||0)}</div></div>
    <div class="stat"><div class="label">Avg Fund</div><div class="val">${((s.avg_funding||0)*100).toFixed(4)}%</div></div>
    <div class="stat"><div class="label">Pos Fund</div><div class="val pos">${s.positive_funding_count||0}</div></div>
    <div class="stat"><div class="label">Neg Fund</div><div class="val neg">${s.negative_funding_count||0}</div></div>`;
}

function renderShorts(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let shorts=(DATA.short_rankings||[]).filter(s=>!q||s.symbol.toLowerCase().includes(q));
  document.getElementById('short-count').textContent=shorts.length;
  document.getElementById('shorts').innerHTML=shorts.map((s,i)=>{
    const sc=s.total_score||0;
    return`<div class="lb-row${selectedSym===s.symbol?' active':''}" onclick="selectSym('${s.symbol}')">
      <span class="lb-rank">#${i+1}</span>
      <span class="lb-sym">${s.symbol}</span>
      <div class="lb-bar"><div class="lb-bar-fill" style="width:${sc}%;background:${sc>=70?'var(--red)':sc>=50?'var(--yellow)':'var(--green)'}"></div></div>
      <span class="lb-score ${sc>=70?'hi':sc>=50?'md':'lo'}">${sc.toFixed(0)}</span>
    </div>`;
  }).join('');
}

function selectSym(sym){
  selectedSym=sym;
  renderShorts();
  renderFactors(sym);
  renderChart(sym);
}

function renderFactors(sym){
  document.getElementById('factor-sym').textContent=sym;
  const f=(DATA.factors||{})[sym];
  if(!f){document.getElementById('factors').innerHTML='<div style="color:var(--dim)">No data</div>';return}
  const meta=[
    {fn:'reversal_8w',label:'Reversal 8w',explain:'Higher = recent winner = will revert = GOOD short'},
    {fn:'volatility_30d',label:'Volatility 30d',explain:'Higher = more volatile = squeeze risk = BAD for short'},
    {fn:'funding_carry',label:'Funding Carry',explain:'Higher = you get paid to hold short = GOOD'},
    {fn:'oi_crowding',label:'OI/ADV Crowding',explain:'Higher = crowded position = squeeze risk = BAD'},
    {fn:'momentum_7d',label:'Momentum 7d',explain:'Higher = recent winner = tends to revert = GOOD'},
  ];
  let html=`<div style="font-size:10px;color:var(--dim);margin-bottom:4px">Short Score: <b style="color:var(--text);font-size:14px">${f.total_score||0}</b>/100 | Confidence: ${f.confidence||0}% | Sector: ${f.sector||'?'}</div>`;
  meta.forEach(({fn,label,explain})=>{
    const fd=f[fn];if(!fd||typeof fd!=='object')return;
    const v=fd.value||0;
    // For vol and crowding, LOW is good for shorts (inverted)
    const isInverted=fn==='volatility_30d'||fn==='oi_crowding';
    const displayVal=isInverted?(100-v):v;
    const c=displayVal>=70?'var(--red)':displayVal>=50?'var(--yellow)':'var(--green)';
    const check=fd.validated?'&#10003;':'&#10007;';
    html+=`<div class="factor-detail">
      <div class="fd-head">
        <span class="fd-name">${label}</span>
        <span class="fd-val" style="color:${c}">${displayVal.toFixed(0)}</span>
      </div>
      <div class="fd-bar"><div class="fd-bar-fill" style="width:${displayVal}%;background:${c}"></div></div>
      <div class="fd-formula">${fd.formula||'?'} ${check}</div>
      <div class="fd-raw">Raw: ${fd.raw!==null&&fd.raw!==undefined?fd.raw:'N/A'} ${isInverted?'(inverted — low raw is good for shorts)':''}</div>
      <div class="fd-note">${explain}</div>
      ${fd.paper_url?`<div class="fd-paper"><a href="${fd.paper_url}" target="_blank">&#128218; Source paper</a></div>`:''}
    </div>`;
  });
  document.getElementById('factors').innerHTML=html;
}

function renderChart(sym){
  const candles=(DATA.candles||{})[sym];
  if(!candles||!candles.length)return;
  const container=document.getElementById('chart-container');
  container.innerHTML='';
  chartObj=LightweightCharts.createChart(container,{
    width:container.clientWidth,height:320,
    layout:{background:{type:'solid',color:'#0d1117'},textStyle:{color:'#8b949e',fontSize:10}},
    grid:{vertLines:{color:'#1c2128'},horzLines:{color:'#1c2128'}},
    crosshair:{mode:0},
    timeScale:{timeVisible:false,secondsVisible:false},
    rightPriceScale:{borderColor:'#30363d'},
  });
  mainSeries=chartObj.addSeries(LightweightCharts.CandlestickSeries,{
    upColor:'#3fb950',downColor:'#f85149',borderVisible:false,
    wickUpColor:'#3fb950',wickDownColor:'#f85149',
  });
  mainSeries.setData(candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
  // Volume
  const volSeries=chartObj.addSeries(LightweightCharts.HistogramSeries,{
    priceFormat:{type:'volume'},priceScaleId:'vol',
  });
  volSeries.priceScale().applyOptions({scaleMargins:{top:0.8,bottom:0}});
  volSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(63,185,80,.3)':'rgba(248,81,73,.3)'})));
  chartObj.timeScale().fitContent();
}

function renderMarkets(){
  let mkts=(DATA.markets||[]).slice().sort((a,b)=>(b.day_volume||0)-(a.day_volume||0));
  document.getElementById('mkt-body').innerHTML=mkts.slice(0,30).map(m=>{
    const c=m.funding>0?'pos':m.funding<0?'neg':'';
    return`<tr><td style="font-weight:600">${m.symbol}</td><td class="num">$${fmtPx(m.mark_px)}</td><td class="num">$${fmtV(m.day_volume)}</td><td class="num ${c}">${(m.funding*100).toFixed(4)}%</td></tr>`;
  }).join('');
}

function fmtV(v){if(!v)return'0';if(v>=1e9)return(v/1e9).toFixed(1)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(1)+'K';return v.toFixed(0)}
function fmtPx(v){if(!v)return'0';if(v>=1000)return v.toFixed(0);if(v>=1)return v.toFixed(2);if(v>=0.01)return v.toFixed(4);return v.toFixed(6)}

async function sendChat(){
  const input=document.getElementById('chat-input');const msg=input.value.trim();if(!msg)return;input.value='';
  const log=document.getElementById('chat-log');
  log.innerHTML+=`<div class="chat-msg user">${esc(msg)}</div>`;log.scrollTop=log.scrollHeight;
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const d=await r.json();log.innerHTML+=`<div class="chat-msg bot">${esc(d.response||'No response')}</div>`}
  catch(e){log.innerHTML+=`<div class="chat-msg bot" style="color:var(--red)">${e.message}</div>`}
  log.scrollTop=log.scrollHeight;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

loadData();
setInterval(()=>{try{loadData()}catch(e){}},60000);
window.addEventListener('resize',()=>{if(chartObj)chartObj.applyOptions({width:document.getElementById('chart-container').clientWidth})});
</script>
</body>
</html>
