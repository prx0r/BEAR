<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAR — Short Opportunity Engine</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--bright:#f0f6fc;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--yellow:#d29922;--purple:#bc8cff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Cascadia Code','Fira Code',monospace;background:var(--bg);color:var(--text);line-height:1.5;font-size:13px}
.wrap{max-width:1400px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
header h1{font-size:16px;color:var(--bright)} header h1 span{color:var(--green)}
.status{font-size:11px;color:var(--dim)} .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.ok{background:var(--green)} .dot.err{background:var(--red)}
.stats{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 14px;min-width:120px}
.stat .label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:18px;font-weight:700;color:var(--bright)}
.stat .val.pos{color:var(--green)} .stat .val.neg{color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px}
.panel h2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
th:hover{color:var(--text)} td{padding:5px 8px;border-bottom:1px solid var(--border)}
.num{text-align:right} .pos{color:var(--green)} .neg{color:var(--red)}
.search{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);font-family:inherit;font-size:12px;width:200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.bar{height:6px;border-radius:3px;background:var(--border);margin:2px 0}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.score{display:inline-block;min-width:32px;text-align:center;padding:1px 4px;border-radius:3px;font-size:11px;font-weight:600}
.score.hi{background:rgba(248,81,73,.2);color:var(--red)}
.score.md{background:rgba(210,153,34,.2);color:var(--yellow)}
.score.lo{background:rgba(63,185,80,.2);color:var(--green)}
.chat-box{display:flex;gap:6px;margin-top:8px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);font-family:inherit;font-size:12px}
.chat-btn{background:var(--blue);color:#fff;border:none;border-radius:4px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px}
.chat-btn:hover{opacity:.8}
.chat-log{max-height:200px;overflow-y:auto;margin-top:8px;font-size:12px}
.chat-msg{margin:4px 0;padding:6px 10px;border-radius:6px;max-width:85%}
.chat-msg.user{background:rgba(88,166,255,.15);margin-left:auto;text-align:right}
.chat-msg.bot{background:var(--bg);white-space:pre-wrap}
.ranked-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)}
.ranked-row:last-child{border:none}
.rank-num{color:var(--dim);font-size:11px;min-width:20px}
.rank-sym{font-weight:600;min-width:60px}
.rank-bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.rank-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red))}
.rank-score{min-width:40px;text-align:right;font-weight:700}
.rank-meta{font-size:10px;color:var(--dim);min-width:160px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span>BEAR</span> — Short Opportunity Engine</h1>
  <div class="status"><span class="dot ok" id="dot"></span><span id="ts">loading...</span></div>
</header>

<div class="stats" id="stats"></div>

<div class="panel">
  <h2>Ranked Short Opportunities <span style="font-size:10px;color:var(--dim)" id="short-count"></span></h2>
  <div style="margin-bottom:6px"><input class="search" id="search" placeholder="filter by symbol..." oninput="renderShorts()"></div>
  <div id="shorts"></div>
</div>

<div class="grid2">
  <div class="panel">
    <h2>Market Overview <span style="font-size:10px;color:var(--dim)" id="mkt-count"></span></h2>
    <div style="margin-bottom:6px"><input class="search" id="mkt-search" placeholder="filter..." oninput="renderMarkets()"></div>
    <div style="max-height:400px;overflow-y:auto">
      <table><thead><tr><th>Symbol</th><th class="num">Price</th><th class="num">Volume</th><th class="num">Funding</th><th class="num">OI</th></tr></thead>
      <tbody id="mkt-body"></tbody></table>
    </div>
  </div>
  <div class="panel">
    <h2>Factor Breakdown — <span id="factor-sym" style="color:var(--blue)">click a short</span></h2>
    <div id="factors" style="padding:8px 0"></div>
    <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:8px">
      <h2>Engine Status</h2>
      <div id="engine-status" style="font-size:11px;color:var(--dim)"></div>
    </div>
  </div>
</div>

<div class="panel">
  <h2>BEAR Chat</h2>
  <div class="chat-log" id="chat-log"></div>
  <div class="chat-box">
    <input class="chat-input" id="chat-input" placeholder="ask about markets, shorts, factors..." onkeydown="if(event.key==='Enter')sendChat()">
    <button class="chat-btn" onclick="sendChat()">Ask</button>
  </div>
</div>
</div>

<script id="bear-data" type="application/json">
{BEAR_DATA_PLACEHOLDER}
</script>
<script>
const API = location.port === '8877' ? '' : '';
let DATA = null;

function loadData() {
  try {
    const el = document.getElementById('bear-data');
    const txt = el.textContent.trim();
    if (txt && txt !== '{BEAR_DATA_PLACEHOLDER}') {
      DATA = JSON.parse(txt);
    }
  } catch(e) {}
  if (!DATA || !DATA.markets) {
    document.getElementById('dot').className = 'dot err';
    document.getElementById('ts').textContent = 'No data — run export_data.py';
    return;
  }
  document.getElementById('dot').className = 'dot ok';
  document.getElementById('ts').textContent = 'Updated: ' + (DATA.timestamp || 'unknown');
  renderStats();
  renderShorts();
  renderMarkets();
  renderEngineStatus();
}

function renderStats() {
  const s = DATA.stats || {};
  const vol = s.total_24h_volume || 0;
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat"><div class="label">Markets</div><div class="val">${s.total_markets||0}</div></div>
    <div class="stat"><div class="label">24h Volume</div><div class="val">$${fmtVol(vol)}</div></div>
    <div class="stat"><div class="label">Avg Funding</div><div class="val">${((s.avg_funding||0)*100).toFixed(4)}%</div></div>
    <div class="stat"><div class="label">Pos Funding</div><div class="val pos">${s.positive_funding_count||0}</div></div>
    <div class="stat"><div class="label">Neg Funding</div><div class="val neg">${s.negative_funding_count||0}</div></div>
  `;
}

function renderShorts() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  let shorts = (DATA.short_rankings || []).filter(s => !q || s.symbol.toLowerCase().includes(q));
  const el = document.getElementById('shorts');
  document.getElementById('short-count').textContent = shorts.length + ' assets';
  if (!shorts.length) { el.innerHTML = '<div style="color:var(--dim);padding:8px">No shorts found</div>'; return; }
  el.innerHTML = shorts.map((s, i) => {
    const score = s.total_score || 0;
    const pct = score;
    return `<div class="ranked-row" onclick="showFactor('${s.symbol}')" style="cursor:pointer">
      <span class="rank-num">#${i+1}</span>
      <span class="rank-sym">${s.symbol}</span>
      <div class="rank-bar"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
      <span class="rank-score score ${score>=75?'hi':score>=50?'md':'lo'}">${score.toFixed(0)}</span>
      <span class="rank-meta">vol $${fmtVol(s.mark_px*(s.oi_crowding||1e6))} | fund ${(s.funding*100).toFixed(4)}%</span>
    </div>`;
  }).join('');
}

function renderMarkets() {
  const q = (document.getElementById('mkt-search').value || '').toLowerCase();
  let mkts = (DATA.markets || []).filter(m => !q || m.symbol.toLowerCase().includes(q));
  mkts.sort((a,b) => (b.day_volume||0) - (a.day_volume||0));
  const el = document.getElementById('mkt-body');
  document.getElementById('mkt-count').textContent = mkts.length + ' assets';
  el.innerHTML = mkts.slice(0, 50).map(m => {
    const chg = m.funding > 0 ? 'pos' : m.funding < 0 ? 'neg' : '';
    return `<tr>
      <td style="font-weight:600">${m.symbol}</td>
      <td class="num">$${fmtPx(m.mark_px)}</td>
      <td class="num">$${fmtVol(m.day_volume)}</td>
      <td class="num ${chg}">${(m.funding*100).toFixed(4)}%</td>
      <td class="num">$${fmtVol(m.open_interest)}</td>
    </tr>`;
  }).join('');
}

function showFactor(sym) {
  document.getElementById('factor-sym').textContent = sym;
  const f = (DATA.factors || {})[sym];
  if (!f) { document.getElementById('factors').innerHTML = '<div style="color:var(--dim)">No factor data for ' + sym + '</div>'; return; }
  const factors = [
    {name:'Dilution 8w', val:f.dilution||50},
    {name:'Reversal 8w', val:f.reversal||50},
    {name:'Unlock Pressure', val:f.unlock||50},
    {name:'Value Badness', val:f.value||50},
    {name:'Squeeze Risk', val:f.squeeze||50},
    {name:'Funding Carry', val:f.carry||50},
  ];
  document.getElementById('factors').innerHTML = factors.map(fa => {
    const color = fa.val >= 75 ? 'var(--red)' : fa.val >= 50 ? 'var(--yellow)' : 'var(--green)';
    return `<div style="margin:4px 0">
      <div style="display:flex;justify-content:space-between;font-size:11px">
        <span>${fa.name}</span><span style="color:${color}">${fa.val.toFixed(0)}</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${fa.val}%;background:${color}"></div></div>
    </div>`;
  }).join('') + `<div style="margin-top:6px;font-size:10px;color:var(--dim)">Sector: ${f.sector||'?'}</div>`;
}

function renderEngineStatus() {
  const el = document.getElementById('engine-status');
  const shorts = DATA.short_rankings || [];
  const hi = shorts.filter(s => s.total_score >= 75).length;
  const md = shorts.filter(s => s.total_score >= 50 && s.total_score < 75).length;
  el.innerHTML = `
    <div>Factors active: dilution, reversal, unlock, value, squeeze, carry</div>
    <div>High conviction shorts (≥75): <span class="neg">${hi}</span></div>
    <div>Medium shorts (50-74): <span style="color:var(--yellow)">${md}</span></div>
    <div>Data source: Hyperliquid API (live)</div>
    <div>Backtest: 90d hourly, walk-forward</div>
  `;
}

function fmtVol(v) { if (!v) return '0'; if (v >= 1e9) return (v/1e9).toFixed(1)+'B'; if (v >= 1e6) return (v/1e6).toFixed(1)+'M'; if (v >= 1e3) return (v/1e3).toFixed(1)+'K'; return v.toFixed(0); }
function fmtPx(v) { if (!v) return '0'; if (v >= 1000) return v.toFixed(0); if (v >= 1) return v.toFixed(2); if (v >= 0.01) return v.toFixed(4); return v.toFixed(6); }

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const log = document.getElementById('chat-log');
  log.innerHTML += `<div class="chat-msg user">${esc(msg)}</div>`;
  log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(API + '/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg})});
    const d = await r.json();
    log.innerHTML += `<div class="chat-msg bot">${esc(d.response || 'No response')}</div>`;
  } catch(e) {
    log.innerHTML += `<div class="chat-msg bot" style="color:var(--red)">Error: ${e.message}</div>`;
  }
  log.scrollTop = log.scrollHeight;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

loadData();
setInterval(() => { try { loadData(); } catch(e) {} }, 60000);
</script>
</body>
</html>
